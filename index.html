<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PDF Reader</title><style>
:root{--bg:#f4f2ee;--fg:#1c1c1e;--cd:#fff;--ac:#0a84ff;--ln:#0002}
@media(prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--cd:#1e1e20;--ln:#fff3}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:8px 12px;border-radius:10px}
.pri{background:var(--ac);color:#fff}
.top{padding:calc(env(safe-area-inset-top) + 10px) 12px 8px;display:flex;gap:6px;align-items:center}
.top input{flex:1;min-width:0;padding:9px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--cd);color:var(--fg);font:inherit}
#lib{height:100%;display:flex;flex-direction:column}
#grid{flex:1;overflow:auto;padding:8px 14px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px;align-content:start}
.bk{position:relative}.bk img,.ph{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:var(--cd);box-shadow:0 2px 8px #0003;display:block}
.bk b{display:block;font-size:13px;margin-top:6px;max-height:2.7em;overflow:hidden}
.bar{height:3px;background:var(--ln);margin-top:4px}.bar i{display:block;height:100%;background:var(--ac)}
.mn{position:absolute;right:3px;top:3px;background:#0007;color:#fff;border-radius:50%;width:28px;height:28px;padding:0}
#rd{position:fixed;inset:0;display:none;flex-direction:column;background:#777}
#st{flex:1;overflow:auto}#cv{display:block;margin:0 auto}
.hb{position:absolute;left:0;right:0;background:var(--cd);display:flex;align-items:center;gap:2px;padding:6px 8px;box-shadow:0 0 8px #0004;transition:.2s}
#tb{top:0;padding-top:calc(env(safe-area-inset-top) + 6px)}#bb{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom) + 6px)}
.hide #tb{transform:translateY(-110%)}.hide #bb{transform:translateY(110%)}
#tt{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:14px}
#sl{flex:1}
#sh{position:fixed;left:0;right:0;bottom:0;max-height:75%;background:var(--cd);border-radius:16px 16px 0 0;box-shadow:0 -4px 20px #0006;display:none;flex-direction:column;z-index:9}
#sh h3{margin:0;padding:14px 16px 6px}#sc{overflow:auto;padding:0 8px 20px}
#sc button{display:block;width:100%;text-align:left;border-bottom:1px solid var(--ln);border-radius:0}
#sc textarea,#sc input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--fg);font:inherit}
#ts{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:20;max-width:90%;text-align:center;font-size:14px}
.em{grid-column:1/-1;text-align:center;opacity:.6;margin-top:60px}
</style></head><body>
<div id="lib"><div class="top"><input id="q" placeholder="Tìm sách…" oninput="draw()"><button class="pri" onclick="addLinks()">+ Link</button><button class="pri" onclick="$('#fi').click()">+ File</button></div><div id="grid"></div></div>
<input id="fi" type="file" accept="application/pdf" multiple hidden>
<div id="rd"><div id="st"><canvas id="cv"></canvas></div>
<div class="hb" id="tb"><button onclick="closeRd()">←</button><span id="tt"></span><button onclick="srch()">🔍</button><button onclick="toc()">☰</button><button id="bm" onclick="bmk()">🔖</button><button onclick="theme()">🌓</button></div>
<div class="hb" id="bb"><button onclick="zoom(-.25)">A−</button><input type="range" id="sl" min="1" value="1" onchange="show(+this.value)"><span id="pg" style="font-size:13px;min-width:62px;text-align:center"></span><button onclick="zoom(.25)">A+</button></div></div>
<div id="sh"><h3 id="sht"></h3><div id="sc"></div></div><div id="ts"></div>
<script src="pdf.min.js"></script><script>
pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.min.js';
const $=s=>document.querySelector(s),L=(k,d)=>JSON.parse(localStorage.getItem(k)||d),S=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let books=L('books','[]'),cfg=L('cfg','{"th":0,"z":1}'),cur=null,pdf=null,busy=false,want=0;
const db=new Promise(r=>{const q=indexedDB.open('pdf',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>r(q.result)});
const idb=async(m,k,v)=>{const d=await db;return new Promise((ok,no)=>{const s=d.transaction('f',m=='get'?'readonly':'readwrite').objectStore('f');const q=m=='get'?s.get(k):m=='put'?s.put(v,k):s.delete(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t,ms=2500){const e=$('#ts');e.textContent=t;e.style.display='block';clearTimeout(toast.t);if(ms)toast.t=setTimeout(()=>e.style.display='none',ms)}
function sheet(t,h){$('#sht').textContent=t;$('#sc').innerHTML=h;$('#sh').style.display='flex'}
function closeSheet(){$('#sh').style.display='none'}
function norm(u){u=u.trim();const m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/)||u.match(/drive\.google\.com\/(?:open|uc)\?[^ ]*?id=([\w-]+)/)||u.match(/docs\.google\.com\/\w+\/d\/([\w-]+)/);return m?`https://drive.usercontent.google.com/download?id=${m[1]}&export=download&confirm=t`:u}
async function get(u){u=norm(u);let b;const H=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.CapacitorHttp;
 if(H){const r=await H.request({url:u,method:'GET',responseType:'blob',headers:{'User-Agent':'Mozilla/5.0'}});if(r.status>=400)throw Error('HTTP '+r.status);const s=atob(r.data),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);b=a.buffer}
 else{const r=await fetch(u);if(!r.ok)throw Error('HTTP '+r.status);b=await r.arrayBuffer()}
 if(new TextDecoder().decode(b.slice(0,5))!='%PDF-')throw Error('Không phải file PDF (Drive: chọn chia sẻ "Bất kỳ ai có đường liên kết")');return b}
async function thumb(p){const pg=await p.getPage(1),v=pg.getViewport({scale:1}),sc=240/v.width,c=document.createElement('canvas');const vp=pg.getViewport({scale:sc});c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;return c.toDataURL('image/jpeg',.6)}
async function addBuf(buf,title,url,id){const p=await pdfjsLib.getDocument({data:buf.slice(0)}).promise;const mt=await p.getMetadata().catch(()=>null);const cover=await thumb(p);id=id||'b'+Date.now()+Math.random().toString(36).slice(2,6);await idb('put',id,buf);
 const old=books.find(x=>x.id==id);if(old){Object.assign(old,{cover,pages:p.numPages})}else books.unshift({id,title:(mt&&mt.info&&mt.info.Title)||title,url,cover,pages:p.numPages,page:1,bm:[],t:Date.now()});S('books',books);draw()}
function addLinks(){sheet('Thêm sách từ link','<p style="margin:6px 8px;font-size:13px;opacity:.7">Mỗi dòng 1 link: link Google Drive (chia sẻ "Bất kỳ ai có liên kết") hoặc link tải PDF trực tiếp. Có thể đặt tên: <i>Tên | link</i></p><textarea id="lk" rows="6" placeholder="https://drive.google.com/file/d/…/view"></textarea><button class="pri" style="margin-top:10px;text-align:center" onclick="doLinks()">Tải về máy</button>')}
async function doLinks(){const ls=$('#lk').value.split('\n').map(x=>x.trim()).filter(Boolean);closeSheet();let ok=0,i=0;for(const l of ls){i++;const [n,u]=l.includes('|')?l.split('|').map(x=>x.trim()):['',l];try{toast(`Đang tải ${i}/${ls.length}…`,0);const b=await get(u);await addBuf(b,n||decodeURIComponent(u.split('?')[0].split('/').pop()||'Sách').replace(/\.pdf$/i,'')||'Sách',u);ok++}catch(e){toast(`Lỗi (${i}): ${e.message}`,4000);await new Promise(r=>setTimeout(r,2500))}}toast(`Xong: ${ok}/${ls.length} sách`)}
$('#fi').onchange=async e=>{for(const f of e.target.files){try{toast('Đang thêm '+f.name,0);await addBuf(await f.arrayBuffer(),f.name.replace(/\.pdf$/i,''),'')}catch(x){toast('Lỗi: '+x.message)}}e.target.value='';toast('Xong')};
function draw(){const q=$('#q').value.toLowerCase(),l=books.filter(b=>b.title.toLowerCase().includes(q)).sort((a,b)=>b.t-a.t);$('#grid').innerHTML=l.length?l.map(b=>`<div class="bk"><div onclick="openB('${b.id}')"><img src="${b.cover}"><b>${esc(b.title)}</b><div class="bar"><i style="width:${Math.round(b.page/b.pages*100)}%"></i></div></div><button class="mn" onclick="menu('${b.id}')">⋯</button></div>`).join(''):'<div class="em">Chưa có sách.<br>Bấm "+ Link" hoặc "+ File" để thêm.</div>'}
function menu(id){const b=books.find(x=>x.id==id);sheet(b.title,`<button onclick="ren('${id}')">✏️ Đổi tên</button>${b.url?`<button onclick="redl('${id}')">⬇️ Tải lại từ link</button>`:''}<button onclick="del('${id}')">🗑️ Xoá khỏi máy</button>`)}
function ren(id){const b=books.find(x=>x.id==id),n=prompt('Tên mới',b.title);closeSheet();if(n){b.title=n;S('books',books);draw()}}
async function del(id){closeSheet();if(!confirm('Xoá sách này?'))return;await idb('del',id);books=books.filter(x=>x.id!=id);S('books',books);draw()}
async function redl(id){closeSheet();const b=books.find(x=>x.id==id);try{toast('Đang tải lại…',0);await addBuf(await get(b.url),b.title,b.url,id);toast('Xong')}catch(e){toast('Lỗi: '+e.message)}}
async function openB(id){cur=books.find(x=>x.id==id);try{const buf=await idb('get',id);pdf=await pdfjsLib.getDocument({data:buf.slice(0)}).promise}catch(e){return toast('Không mở được: '+e.message)}
 cur.t=Date.now();$('#tt').textContent=cur.title;$('#sl').max=pdf.numPages;$('#rd').style.display='flex';$('#rd').classList.remove('hide');show(cur.page||1)}
function closeRd(){$('#rd').style.display='none';closeSheet();S('books',books);pdf=null;draw()}
const FL=['none','sepia(.6) contrast(.9) brightness(.95)','invert(1) hue-rotate(180deg)'],BG=['#777','#c9b98f','#000'];
function theme(){cfg.th=(cfg.th+1)%3;S('cfg',cfg);paint()}
function paint(){$('#cv').style.filter=FL[cfg.th];$('#st').style.background=BG[cfg.th]}
function zoom(d){cfg.z=Math.max(1,Math.min(4,cfg.z+d));S('cfg',cfg);show(cur.page)}
async function show(n){n=Math.max(1,Math.min(pdf.numPages,n));if(busy){want=n;return}busy=true;cur.page=n;try{const p=await pdf.getPage(n),w=$('#st').clientWidth,sc=w/p.getViewport({scale:1}).width*cfg.z,dpr=Math.min(window.devicePixelRatio||1,2),v=p.getViewport({scale:sc*dpr}),c=$('#cv');c.width=v.width;c.height=v.height;c.style.width=v.width/dpr+'px';c.style.height=v.height/dpr+'px';await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise}catch(e){}
 paint();$('#pg').textContent=`${n} / ${pdf.numPages}`;$('#sl').value=n;$('#bm').style.opacity=cur.bm.includes(n)?1:.4;$('#st').scrollTop=0;S('books',books);busy=false;if(want&&want!=n){const w=want;want=0;show(w)}}
let tx=0;$('#st').addEventListener('touchstart',e=>tx=e.changedTouches[0].clientX,{passive:true});
$('#st').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>70&&cfg.z<=1.01){show(cur.page+(d<0?1:-1));e.preventDefault()}},{passive:false});
$('#st').onclick=e=>{const x=e.clientX/innerWidth;if(cfg.z<=1.01&&x<.2)show(cur.page-1);else if(cfg.z<=1.01&&x>.8)show(cur.page+1);else $('#rd').classList.toggle('hide')};
function bmk(){const i=cur.bm.indexOf(cur.page);i<0?cur.bm.push(cur.page):cur.bm.splice(i,1);cur.bm.sort((a,b)=>a-b);S('books',books);$('#bm').style.opacity=i<0?1:.4;toast(i<0?'Đã đánh dấu trang '+cur.page:'Đã bỏ đánh dấu',1200)}
function go(n){closeSheet();show(n)}
function srch(){sheet('Tìm trong sách','<input id="sq" placeholder="Nhập từ khoá rồi bấm Enter" onkeydown="if(event.key==\'Enter\')doS(this.value)"><div id="sr"></div>');$('#sq').focus()}
async function doS(t){t=t.trim().toLowerCase();if(!t)return;const r=[];for(let i=1;i<=pdf.numPages&&r.length<150;i++){$('#sr').textContent=`Đang tìm… ${i}/${pdf.numPages}`;const tc=await(await pdf.getPage(i)).getTextContent(),s=tc.items.map(x=>x.str).join(' '),k=s.toLowerCase().indexOf(t);if(k>=0)r.push(`<button onclick="go(${i})"><b>Trang ${i}</b><br><small>…${esc(s.slice(Math.max(0,k-40),k+80))}…</small></button>`)}$('#sr').innerHTML=r.join('')||'<p style="padding:10px">Không tìm thấy.</p>'}
async function toc(){let h='';const bm=cur.bm.map(n=>`<button onclick="go(${n})">🔖 Trang ${n}</button>`).join('');
 try{const o=await pdf.getOutline();const walk=async(a,d)=>{for(const it of a){try{let de=it.dest;if(typeof de=='string')de=await pdf.getDestination(de);const n=(await pdf.getPageIndex(de[0]))+1;h+=`<button style="padding-left:${12+d*16}px" onclick="go(${n})">${esc(it.title)}<small style="float:right;opacity:.5">${n}</small></button>`}catch(e){}if(it.items&&it.items.length)await walk(it.items,d+1)}};if(o)await walk(o,0)}catch(e){}
 sheet('Mục lục & đánh dấu',(bm?'<b style="padding:8px;display:block">Đánh dấu</b>'+bm:'')+(h?'<b style="padding:8px;display:block">Mục lục</b>'+h:'')||'<p style="padding:10px">Chưa có mục lục hoặc đánh dấu.</p>')}
function init(){draw();const A=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App;if(A)A.addListener('backButton',()=>{if($('#sh').style.display=='flex')closeSheet();else if($('#rd').style.display=='flex')closeRd();else A.exitApp()})}
init();
</script></body></html>
